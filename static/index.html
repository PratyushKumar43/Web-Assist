<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexi &bull; Emirates NBD Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-outer: #060b0e;
      --bg-chat: #0b141a;
      --bg-header: rgba(17, 27, 33, 0.88);
      --bg-bot-bubble: #202c33;
      --bg-user-bubble: #005c4b;
      --bg-card: #162026;
      --bg-card-hover: #1c2830;
      --bg-input: #202c33;
      --bg-chip: #182229;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --text-primary: #e9edef;
      --text-secondary: #8696a0;
      --text-user: #e9edef;
      --accent-emerald: #00a884;
      --accent-emerald-soft: rgba(0, 168, 132, 0.16);
      --accent-gold: #f59e0b;
      --accent-gold-soft: rgba(245, 158, 11, 0.12);
      --accent-blue: #38bdf8;
      --accent-blue-soft: rgba(56, 189, 248, 0.15);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
      --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.55);
      --wallpaper-opacity: 0.04;
    }

    [data-theme="light"] {
      --bg-outer: #d1d7db;
      --bg-chat: #efeae2;
      --bg-header: rgba(240, 242, 245, 0.9);
      --bg-bot-bubble: #ffffff;
      --bg-user-bubble: #d9fdd3;
      --bg-card: #f7f8fa;
      --bg-card-hover: #eef1f5;
      --bg-input: #ffffff;
      --bg-chip: #ffffff;
      --border-subtle: rgba(0, 0, 0, 0.08);
      --border-strong: rgba(0, 0, 0, 0.14);
      --text-primary: #111b21;
      --text-secondary: #54656f;
      --text-user: #111b21;
      --accent-emerald: #008069;
      --accent-emerald-soft: rgba(0, 128, 105, 0.12);
      --accent-gold: #b45309;
      --accent-gold-soft: rgba(245, 158, 11, 0.14);
      --accent-blue: #0284c7;
      --accent-blue-soft: rgba(2, 132, 199, 0.12);
      --shadow-sm: 0 1px 4px rgba(11, 20, 26, 0.08);
      --shadow-lg: 0 18px 40px rgba(11, 20, 26, 0.15);
      --wallpaper-opacity: 0.06;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-outer);
      color: var(--text-primary);
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background 0.25s ease;
    }

    /* Main App Frame */
    .app-shell {
      width: 100%;
      max-width: 960px;
      height: 100dvh;
      max-height: 920px;
      background: var(--bg-chat);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .app-shell {
        height: 94dvh;
        border-radius: 20px;
        border: 1px solid var(--border-subtle);
      }
    }

    /* Subtle Geometric Wallpaper */
    .chat-wallpaper {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: var(--wallpaper-opacity);
      background-image: radial-gradient(circle at 25px 25px, currentColor 2px, transparent 0),
                        radial-gradient(circle at 75px 75px, currentColor 2px, transparent 0);
      background-size: 100px 100px;
      z-index: 0;
    }

    /* Top Header */
    .chat-header {
      position: relative;
      z-index: 10;
      background: var(--bg-header);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .avatar-wrap {
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00a884, #005c4b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 17px;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 2px 10px rgba(0, 168, 132, 0.35);
    }

    .status-dot {
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 11px;
      height: 11px;
      background: #25d366;
      border: 2px solid var(--bg-chat);
      border-radius: 50%;
      animation: pulse 2.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.18); opacity: 0.85; }
    }

    .header-info {
      min-width: 0;
    }

    .header-title-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-title {
      font-size: 15.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .verified-tick {
      width: 16px;
      height: 16px;
      color: #25d366;
      flex-shrink: 0;
    }

    .header-subtitle {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .pill-stat {
      display: none;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--accent-emerald-soft);
      color: var(--accent-emerald);
      border: 1px solid rgba(0, 168, 132, 0.25);
      white-space: nowrap;
    }

    @media (min-width: 600px) {
      .pill-stat { display: inline-flex; }
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s ease;
    }

    .icon-btn:hover {
      background: var(--border-subtle);
      color: var(--text-primary);
    }

    /* Chat Messages Area */
    .chat-messages {
      position: relative;
      z-index: 1;
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(134, 150, 160, 0.25);
      border-radius: 999px;
    }

    .date-divider {
      align-self: center;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--bg-header);
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      margin-bottom: 4px;
    }

    /* Message Bubbles */
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 88%;
      animation: fadeSlideIn 0.24s ease-out;
    }

    @media (min-width: 768px) {
      .msg-row { max-width: 78%; }
    }

    .msg-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-row.bot {
      align-self: flex-start;
      align-items: flex-start;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bubble {
      padding: 11px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      box-shadow: var(--shadow-sm);
      position: relative;
      word-wrap: break-word;
    }

    .msg-row.user .bubble {
      background: var(--bg-user-bubble);
      color: var(--text-user);
      border-top-right-radius: 4px;
    }

    .msg-row.bot .bubble {
      background: var(--bg-bot-bubble);
      color: var(--text-primary);
      border-top-left-radius: 4px;
      border: 1px solid var(--border-subtle);
      width: 100%;
    }

    /* Fallback bubble: the bot declined, so the answer is visually flagged */
    .msg-row.bot .bubble.bubble-fallback {
      background: var(--accent-gold-soft);
      border-color: rgba(245, 158, 11, 0.45);
    }

    /* Intent & Grounding Header inside Bot Bubble */
    .bubble-meta-top {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 2.5px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .badge-fact { background: var(--accent-blue-soft); color: var(--accent-blue); }
    .badge-discovery { background: var(--accent-emerald-soft); color: var(--accent-emerald); }
    .badge-comparison { background: var(--accent-gold-soft); color: var(--accent-gold); }
    .badge-fallback { background: var(--accent-gold-soft); color: var(--accent-gold); }
    .badge-cache {
      background: rgba(168, 85, 247, 0.16);
      color: #c084fc;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .grounded-label {
      font-size: 11px;
      color: var(--text-secondary);
      margin-left: auto;
    }

    /* Key-Value Spec Box for FACT */
    .spec-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
      margin: 10px 0;
    }

    .spec-item {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .spec-label {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }

    .spec-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
    }

    /* Swipeable Product Cards for DISCOVERY & COMPARISON */
    .cards-carousel {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 8px 2px 10px;
      margin: 6px -4px;
      scroll-snap-type: x mandatory;
    }

    .cards-carousel::-webkit-scrollbar {
      height: 5px;
    }

    .cards-carousel::-webkit-scrollbar-thumb {
      background: rgba(134, 150, 160, 0.3);
      border-radius: 999px;
    }

    .product-card {
      flex: 0 0 245px;
      scroll-snap-align: start;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: 13px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .product-card:hover {
      background: var(--bg-card-hover);
      transform: translateY(-2px);
    }

    .card-cat {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--accent-emerald);
      letter-spacing: 0.04em;
    }

    .card-title {
      font-size: 13.5px;
      font-weight: 700;
      margin: 4px 0 8px;
      line-height: 1.3;
    }

    .card-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 8px;
    }

    .fee-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--accent-emerald-soft);
      color: var(--accent-emerald);
    }

    .salary-pill {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 6px;
      background: var(--border-subtle);
      color: var(--text-secondary);
    }

    .card-highlight {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .card-action-btn {
      width: 100%;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--accent-emerald);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .card-action-btn:hover {
      background: var(--accent-emerald-soft);
    }

    /* Bullet list styling */
    .clean-list {
      margin: 8px 0 4px 18px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 13.5px;
    }

    /* Collapsible Sources Drawer */
    .sources-wrap {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
    }

    .sources-toggle {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 11.5px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .sources-toggle:hover {
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    .sources-list {
      display: none;
      flex-direction: column;
      gap: 5px;
      margin-top: 8px;
      padding: 8px 10px;
      background: var(--bg-card);
      border-radius: 10px;
      font-size: 12px;
    }

    .sources-list.open {
      display: flex;
    }

    .sources-list a {
      color: var(--accent-emerald);
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sources-list a:hover {
      text-decoration: underline;
    }

    .source-meta {
      color: var(--text-secondary);
      font-size: 10.5px;
      white-space: nowrap;
    }

    /* Bubble Footer: Timestamp, Read Ticks, Feedback */
    .bubble-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .feedback-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .fb-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .fb-btn:hover {
      background: var(--border-subtle);
      color: var(--text-primary);
    }

    .fb-btn.active-up {
      color: #25d366;
      background: rgba(37, 211, 102, 0.14);
      border-color: rgba(37, 211, 102, 0.3);
    }

    .fb-btn.active-down {
      color: #f87171;
      background: rgba(248, 113, 113, 0.14);
      border-color: rgba(248, 113, 113, 0.3);
    }

    .fb-toast {
      font-size: 10.5px;
      color: var(--accent-emerald);
      margin-left: 4px;
    }

    .time-ticks {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: auto;
    }

    .ticks-blue {
      color: #53bdeb;
      font-weight: 700;
    }

    /* Typing Indicator */
    .typing-bubble {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 12px 16px;
      background: var(--bg-bot-bubble);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      border-top-left-radius: 4px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-secondary);
      animation: bounce 1.3s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.16s; }
    .dot:nth-child(3) { animation-delay: 0.32s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
      40% { transform: scale(1.1); opacity: 1; }
    }

    /* Bottom Dock: Smart Chips + Pill Input */
    .bottom-dock {
      position: relative;
      z-index: 10;
      padding: 8px 14px 14px;
      background: var(--bg-chat);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .chips-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .chips-row::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex-shrink: 0;
      background: var(--bg-chip);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      font-size: 12.5px;
      font-weight: 500;
      padding: 6px 13px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.16s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip:hover {
      border-color: var(--accent-emerald);
      background: var(--accent-emerald-soft);
    }

    .input-bar {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-wrap {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      padding: 4px 16px;
      display: flex;
      align-items: center;
      transition: border-color 0.2s ease;
    }

    .input-wrap:focus-within {
      border-color: var(--accent-emerald);
    }

    .input-wrap input {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 14px;
      padding: 8px 0;
      outline: none;
    }

    .input-wrap input::placeholder {
      color: var(--text-secondary);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--accent-emerald);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 3px 12px rgba(0, 168, 132, 0.35);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .send-btn:hover {
      transform: scale(1.05);
      filter: brightness(1.06);
    }

    .send-btn:active {
      transform: scale(0.96);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: default;
      transform: none;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="chat-wallpaper"></div>

    <!-- Frosted WhatsApp Header -->
    <header class="chat-header">
      <div class="header-left">
        <div class="avatar-wrap">
          L
          <span class="status-dot" title="Backend connected"></span>
        </div>
        <div class="header-info">
          <div class="header-title-row">
            <span class="header-title">Lexi &bull; Emirates NBD</span>
            <svg class="verified-tick" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2L14.8 4.2L18.3 3.9L19.6 7.2L22.5 9.2L21.7 12.6L23.3 15.8L20.7 18.2L20.3 21.7L16.8 22.1L14.3 24L11.2 22.4L8.1 24L5.6 22.1L2.1 21.7L1.7 18.2L-0.9 15.8L0.7 12.6L-0.1 9.2L2.8 7.2L4.1 3.9L7.6 4.2L10.4 2H12ZM10.3 16.5L17.4 9.4L16 8L10.3 13.7L7.5 10.9L6.1 12.3L10.3 16.5Z"/>
            </svg>
          </div>
          <div class="header-subtitle">
            <span>Qdrant Hybrid RAG &bull; Sources verified</span>
          </div>
        </div>
      </div>

      <div class="header-actions">
        <span class="pill-stat" id="productPill" title="Products covered by the knowledge base">&#128230; <span id="productCount">&hellip;</span> Verified Products</span>
        <button class="icon-btn" id="themeToggle" title="Toggle Dark/Light Theme" aria-label="Toggle Theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
          </svg>
        </button>
        <button class="icon-btn" id="resetBtn" title="New Conversation Session" aria-label="New Session">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Scrollable Chat Feed -->
    <main class="chat-messages" id="chatMessages">
      <div class="date-divider">Today &bull; Grounded Banking Session</div>
    </main>

    <!-- Smart Quick-Reply Chips + Pill Input -->
    <footer class="bottom-dock">
      <div class="chips-row" id="chipsRow"></div>
      <form class="input-bar" id="chatForm">
        <div class="input-wrap">
          <input
            type="text"
            id="userInput"
            placeholder="Ask about credit cards, fees, accounts, or eligibility..."
            autocomplete="off"
            aria-label="Your message"
          />
        </div>
        <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </footer>
  </div>

  <script>
    // Set this to e.g. "http://localhost:8000" when the UI is served from another origin.
    const API_BASE = "";
    const CHAT_ENDPOINT = API_BASE + "/api/chat/ui";
    const FEEDBACK_ENDPOINT = API_BASE + "/api/feedback";
    const PRODUCTS_ENDPOINT = API_BASE + "/api/products";

    let sessionId = newSessionId();
    let isSubmitting = false;
    let sourceListSeq = 0;

    const chatMessages = document.getElementById("chatMessages");
    const chipsRow = document.getElementById("chipsRow");
    const chatForm = document.getElementById("chatForm");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const themeToggle = document.getElementById("themeToggle");
    const resetBtn = document.getElementById("resetBtn");
    const productCount = document.getElementById("productCount");
    const productPill = document.getElementById("productPill");

    const WELCOME_CHIPS = [
      "What credit cards and commercial cards are available?",
      "What savings and account options can I open?",
      "Compare Millionaire Account versus standard savings accounts",
      "What is the annual fee of U By Emaar Signature Credit Card?"
    ];

    function newSessionId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      return "sess_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // Only http(s) links are rendered as sources, so metadata can never inject a scheme.
    function safeUrl(url) {
      try {
        const parsed = new URL(String(url), window.location.origin);
        if (parsed.protocol === "http:" || parsed.protocol === "https:") return parsed.href;
      } catch (_) { /* fall through */ }
      return "";
    }

    function nowTime() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    /* ------------------------------- theme + session ------------------------------- */

    const savedTheme = localStorage.getItem("lexi-theme");
    if (savedTheme === "light" || savedTheme === "dark") {
      document.documentElement.setAttribute("data-theme", savedTheme);
    }

    themeToggle.addEventListener("click", () => {
      const html = document.documentElement;
      const next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
      html.setAttribute("data-theme", next);
      localStorage.setItem("lexi-theme", next);
    });

    resetBtn.addEventListener("click", () => {
      sessionId = newSessionId();
      chatMessages.innerHTML = '<div class="date-divider">New Session &bull; Working Memory Reset</div>';
      renderWelcome();
    });

    /* ----------------------------------- catalog ---------------------------------- */

    async function loadCatalogCount() {
      try {
        const res = await fetch(PRODUCTS_ENDPOINT);
        if (!res.ok) throw new Error("catalog unavailable");
        const products = await res.json();
        productCount.textContent = products.length;
        if (!products.length) productPill.style.display = "none";
      } catch (_) {
        productPill.style.display = "none";
      }
    }

    /* -------------------------------- message shell -------------------------------- */

    function renderChips(chips) {
      chipsRow.innerHTML = "";
      (chips || []).forEach((label) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.textContent = label;
        btn.addEventListener("click", () => sendMessage(label));
        chipsRow.appendChild(btn);
      });
    }

    function appendUserBubble(text) {
      const row = document.createElement("div");
      row.className = "msg-row user";
      row.innerHTML = `
        <div class="bubble">
          <div>${escapeHtml(text)}</div>
          <div class="bubble-footer">
            <span class="time-ticks">${nowTime()} <span class="ticks-blue">&#10003;&#10003;</span></span>
          </div>
        </div>
      `;
      chatMessages.appendChild(row);
      scrollToBottom();
    }

    function showTyping() {
      const row = document.createElement("div");
      row.className = "msg-row bot";
      row.id = "typingIndicator";
      row.innerHTML = `
        <div class="typing-bubble">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>
      `;
      chatMessages.appendChild(row);
      scrollToBottom();
    }

    function hideTyping() {
      const el = document.getElementById("typingIndicator");
      if (el) el.remove();
    }

    function appendErrorBubble(message) {
      const row = document.createElement("div");
      row.className = "msg-row bot";
      row.innerHTML = `
        <div class="bubble bubble-fallback">
          <div class="bubble-meta-top">
            <span class="badge badge-fallback">Connection problem</span>
          </div>
          <div>${escapeHtml(message)}</div>
        </div>
      `;
      chatMessages.appendChild(row);
      scrollToBottom();
    }

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    /* ------------------------------- answer rendering ------------------------------ */

    function badgeFor(payload) {
      if (!payload.intent) return "";
      if (payload.answerable === false) {
        return '<span class="badge badge-fallback">Not covered by the site</span>';
      }
      const cls = payload.intent === "DISCOVERY"
        ? "badge-discovery"
        : payload.intent === "COMPARISON"
          ? "badge-comparison"
          : "badge-fact";
      return `<span class="badge ${cls}">${escapeHtml(payload.intent)}</span>`;
    }

    function renderSpecs(specs) {
      if (!specs || !specs.length) return "";
      return `<div class="spec-grid">${specs.map((s) => `
        <div class="spec-item">
          <div class="spec-label">${escapeHtml(s.label)}</div>
          <div class="spec-value">${escapeHtml(s.value)}</div>
        </div>`).join("")}</div>`;
    }

    function renderCards(cards) {
      if (!cards || !cards.length) return "";
      return `<div class="cards-carousel">${cards.map((c) => `
        <div class="product-card">
          <div>
            <div class="card-cat">${escapeHtml(c.category)}</div>
            <div class="card-title">${escapeHtml(c.name)}</div>
            <div class="card-pills">
              <span class="fee-pill">${escapeHtml(c.fee)}</span>
              <span class="salary-pill">${escapeHtml(c.requirement)}</span>
            </div>
            <div class="card-highlight">${escapeHtml(c.highlight)}</div>
          </div>
          <button type="button" class="card-action-btn" data-ask="${escapeHtml(c.name)}">Check eligibility &rarr;</button>
        </div>`).join("")}</div>`;
    }

    function renderBullets(bullets) {
      if (!bullets || !bullets.length) return "";
      return `<ul class="clean-list">${bullets.map((b) => `<li>${escapeHtml(b)}</li>`).join("")}</ul>`;
    }

    function renderSources(sources) {
      if (!sources || !sources.length) return "";
      const listId = "src_" + (++sourceListSeq);
      const items = sources.map((src) => {
        const href = safeUrl(src.url);
        if (!href) return "";
        return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">
          <span>${escapeHtml(src.title || src.url)}</span>
          <span class="source-meta">${escapeHtml(src.last_crawled || "")} &#8599;</span>
        </a>`;
      }).join("");
      return `
        <div class="sources-wrap">
          <button type="button" class="sources-toggle" data-sources="${listId}">
            &#128279; Verified Sources (${sources.length}) &#9662;
          </button>
          <div class="sources-list" id="${listId}">${items}</div>
        </div>`;
    }

    function appendBotBubble(payload) {
      const row = document.createElement("div");
      row.className = "msg-row bot";

      const interactionId = payload.interaction_id || "";
      const isFallback = payload.answerable === false;

      const feedbackHtml = interactionId
        ? `<div class="feedback-actions">
             <button type="button" class="fb-btn" title="Accurate answer" data-feedback="${escapeHtml(interactionId)}" data-rating="up">&#128077;</button>
             <button type="button" class="fb-btn" title="Report an issue" data-feedback="${escapeHtml(interactionId)}" data-rating="down">&#128078;</button>
             <span class="fb-toast" id="toast_${escapeHtml(interactionId)}"></span>
           </div>`
        : "<div></div>";

      row.innerHTML = `
        <div class="bubble${isFallback ? " bubble-fallback" : ""}">
          <div class="bubble-meta-top">
            ${badgeFor(payload)}
            ${payload.cache_hit ? '<span class="badge badge-cache">&#9889; Cached</span>' : ""}
          </div>
          <div>${escapeHtml(payload.intro)}</div>
          ${renderSpecs(payload.specs)}
          ${renderCards(payload.cards)}
          ${renderBullets(payload.bullets)}
          ${renderSources(payload.sources)}
          <div class="bubble-footer">
            ${feedbackHtml}
            <span class="time-ticks">${nowTime()}</span>
          </div>
        </div>
      `;

      chatMessages.appendChild(row);
      scrollToBottom();

      renderChips(payload.next_chips);
    }

    /* --------------------------------- interactions -------------------------------- */

    async function submitFeedback(interactionId, rating, btnEl) {
      const parent = btnEl.parentElement;
      parent.querySelectorAll(".fb-btn").forEach((b) => b.classList.remove("active-up", "active-down"));
      btnEl.classList.add(rating === "up" ? "active-up" : "active-down");

      const toast = document.getElementById("toast_" + interactionId);
      if (toast) toast.textContent = rating === "up" ? "Thanks" : "Flagged";

      try {
        await fetch(FEEDBACK_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ interaction_id: interactionId, rating }),
        });
      } catch (_) {
        if (toast) toast.textContent = "Not saved";
      }
    }

    chatMessages.addEventListener("click", (event) => {
      const sourceToggle = event.target.closest("[data-sources]");
      if (sourceToggle) {
        const list = document.getElementById(sourceToggle.getAttribute("data-sources"));
        if (list) list.classList.toggle("open");
        return;
      }

      const feedbackBtn = event.target.closest("[data-feedback]");
      if (feedbackBtn) {
        submitFeedback(
          feedbackBtn.getAttribute("data-feedback"),
          feedbackBtn.getAttribute("data-rating"),
          feedbackBtn
        );
        return;
      }

      const askBtn = event.target.closest("[data-ask]");
      if (askBtn) {
        sendMessage("Tell me about " + askBtn.getAttribute("data-ask") + " fees and eligibility");
      }
    });

    async function sendMessage(text) {
      const query = String(text || "").trim();
      if (!query || isSubmitting) return;

      isSubmitting = true;
      sendBtn.disabled = true;
      userInput.value = "";

      appendUserBubble(query);
      showTyping();

      try {
        const res = await fetch(CHAT_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message: query }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        hideTyping();
        appendBotBubble(data);
      } catch (err) {
        hideTyping();
        appendErrorBubble(
          "I could not reach the knowledge base (" + err.message + "). Start the backend with " +
          "`fastapi dev app/main.py` and try again."
        );
      } finally {
        isSubmitting = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    chatForm.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage(userInput.value);
    });

    /* ----------------------------------- boot ------------------------------------- */

    function renderWelcome() {
      appendBotBubble({
        intent: null,
        answerable: true,
        intro:
          "Hello, I'm Lexi, your Emirates NBD assistant. I answer from the bank's official product " +
          "pages only: credit and debit cards, accounts, fees, and eligibility. Every figure comes " +
          "with the source page it was read from.",
        next_chips: WELCOME_CHIPS
      });
    }

    renderWelcome();
    loadCatalogCount();
  </script>
</body>
</html>
