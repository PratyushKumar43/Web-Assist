[project]
name = "web-assist-rag"
version = "0.1.0"
description = "Production-grade, highly defensible Website RAG Chatbot using FastAPI, LangGraph, Gemini, and Qdrant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "google-genai>=1.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "qdrant-client>=1.8.0",
    "fastembed>=0.2.0",
    "firecrawl-py>=0.0.16",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
